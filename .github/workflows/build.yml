name: Compilation LanPulse

# Compile l'application pour Windows, macOS (Apple Silicon et Intel) et Linux.
# Produit les installeurs ET les versions portables, puis publie une release.
# - tag v* (ex. v0.1.0) : release GitHub créée avec tous les fichiers ;
# - lancement manuel (Actions > Run workflow) : champ « tag » optionnel pour
#   publier aussi une release ; sinon fichiers dans les « artifacts ».

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release à créer (ex. v0.1.0). Vide = pas de release."
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            name: windows
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macos-apple-silicon
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            name: macos-intel
          - platform: ubuntu-22.04
            args: ""
            name: linux
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libpcap-dev

      - name: SDK Npcap (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.15.zip -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
          "LIB=$env:GITHUB_WORKSPACE\npcap-sdk\Lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBPCAP_LIBDIR=$env:GITHUB_WORKSPACE\npcap-sdk\Lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm install

      - name: Compilation Tauri
        run: npm run build -- ${{ matrix.args }}

      - name: Rassembler les fichiers
        shell: bash
        run: |
          mkdir -p dist
          B=$(ls -d src-tauri/target/*/release/bundle src-tauri/target/release/bundle 2>/dev/null | head -1)
          R=$(dirname "$B")
          case "${{ matrix.name }}" in
            windows)
              cp "$B"/msi/*.msi dist/ ; cp "$B"/nsis/*.exe dist/
              mkdir portable && cp "$R/lanpulse.exe" portable/LanPulse.exe
              printf 'LanPulse portable.\r\nNecessite Npcap (https://npcap.com) pour la vue par application.\r\nLancer LanPulse.exe (administrateur pour la capture).\r\n' > portable/LISEZMOI.txt
              (cd portable && 7z a -tzip ../dist/LanPulse_portable_windows_x64.zip .) ;;
            macos-*)
              cp "$B"/dmg/*.dmg dist/
              (cd "$B/macos" && zip -qr "$GITHUB_WORKSPACE/dist/LanPulse_portable_${{ matrix.name }}.app.zip" LanPulse.app) ;;
            linux)
              cp "$B"/deb/*.deb dist/ ; cp "$B"/rpm/*.rpm dist/
              cp "$B"/appimage/*.AppImage dist/LanPulse_portable_linux_x86_64.AppImage ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: lanpulse-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: LanPulse ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
